# 장 마감 후 일일 수집 배치.
# cron은 UTC 표기 — 07:30 UTC = 16:30 KST(평일). 휴장일은 daily.py가 스스로 판정 후 종료.
name: collect

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 일자 YYYY-MM-DD (기본: 오늘 KST)"
        required: false
      skip_minute:
        description: "분봉 수집 건너뛰고 Turso 적재만 (복구·검증용)"
        type: boolean
        default: false

permissions:
  contents: write # Release 자산 업로드

concurrency:
  group: kiwoom # backfill과 같은 앱키를 쓰므로 동시 실행 금지 (초당 1회 제한)
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0 # v9 이동 태그 없음 — 정확한 버전 고정 필요
      - run: uv sync
      - name: 일일 수집 실행
        env:
          GH_TOKEN: ${{ github.token }}
          TURSO_KRX_MARKET_URL: ${{ secrets.TURSO_KRX_MARKET_URL }}
          TURSO_KRX_MARKET_AUTH_TOKEN: ${{ secrets.TURSO_KRX_MARKET_AUTH_TOKEN }}
          TURSO_TRADING_URL: ${{ secrets.TURSO_TRADING_URL }}
          TURSO_TRADING_AUTH_TOKEN: ${{ secrets.TURSO_TRADING_AUTH_TOKEN }}
          # 키움 모의투자 — 미설정이면 네이버로 자동 폴백
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          # 마감 후 ACCOUNT 미체결 주문 정산용 (daily.py의 settle_accounts)
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 입력을 셸에 직접 보간하면 주입이 된다 — env로 받아 인용·검증한다
          IN_DATE: ${{ inputs.date }}
          IN_SKIP_MINUTE: ${{ inputs.skip_minute }}
        # bash -e에서 `[ ... ] && x=y`는 조건이 거짓일 때 스텝을 종료시키므로 if로 쓴다
        run: |
          args=()
          case "$IN_DATE" in
            "") ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args+=(--date "$IN_DATE") ;;
            *) echo "잘못된 date: $IN_DATE" >&2; exit 1 ;;
          esac
          if [ "$IN_SKIP_MINUTE" = "true" ]; then args+=(--skip-minute); fi
          echo "실행: daily.py ${args[*]}"
          uv run python daily.py "${args[@]}"
