# 장 마감 후 일일 수집 배치.
# cron은 UTC 표기 — 07:30 UTC = 16:30 KST(평일). 휴장일은 daily.py가 스스로 판정 후 종료.
name: collect

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 일자 YYYY-MM-DD (기본: 오늘 KST)"
        required: false

permissions:
  contents: write # Release 자산 업로드

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: 일일 수집 실행
        env:
          GH_TOKEN: ${{ github.token }}
          TURSO_KRX_MARKET_URL: ${{ secrets.TURSO_KRX_MARKET_URL }}
          TURSO_KRX_MARKET_AUTH_TOKEN: ${{ secrets.TURSO_KRX_MARKET_AUTH_TOKEN }}
          TURSO_TRADING_URL: ${{ secrets.TURSO_TRADING_URL }}
          TURSO_TRADING_AUTH_TOKEN: ${{ secrets.TURSO_TRADING_AUTH_TOKEN }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            uv run python daily.py --date "${{ inputs.date }}"
          else
            uv run python daily.py
          fi
