# AI 판단 배치 — claude -p로 BUY/SELL/HOLD를 받아 기록하고(옵션) 자동 주문.
# 장중에 여러 번 돈다. GitHub 예약 실행은 best-effort라 몇 시간씩 밀릴 수 있어
# (실측: 14:10 예약이 17:41에 실행 → 마감 후라 주문 통째 스킵), 한 번만 걸면
# 그날 매매를 통째로 놓친다. 여러 시각에 걸어 최소 한 번은 장중(09:00~15:29)에
# 떨어지게 한다. 판단은 매번 다시 하고, 중복 주문은 decide.py가 '오늘 이미 주문된
# 종목'으로 막는다. 마감 후 지연 실행은 기록만 남기고 주문은 건너뛴다.
name: decide

on:
  schedule:
    # UTC. 01:30/03:30/05:30 = 10:30/12:30/14:30 KST (마지막은 마감 1시간 전)
    - cron: "30 1 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "지표 기준일 YYYY-MM-DD (기본: 오늘 KST). 오늘이 아니면 판단만 기록하고 주문은 생략"
        required: false
      top:
        description: "시총 상위 N종목"
        required: false
      dry_run:
        description: "기록·주문 API를 호출하지 않고 계획만 출력"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 키움 API를 쓰지 않으므로 'kiwoom' 그룹과 분리한다 — collect와 겹쳐도 무해하다.
  group: decide
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: npm install -g @anthropic-ai/claude-code
      - name: AI 판단 실행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TURSO_KRX_MARKET_URL: ${{ secrets.TURSO_KRX_MARKET_URL }}
          TURSO_KRX_MARKET_AUTH_TOKEN: ${{ secrets.TURSO_KRX_MARKET_AUTH_TOKEN }}
          # decision_price(판단 시점 기준가)를 ai_decisions에 직접 기록하는 데 필요하다.
          # 없으면 Turso.from_env("TRADING")이 None이라 기록이 통째로 생략되고,
          # 모든 수익률이 판단일 종가 폴백으로 계산돼 측정 수정이 무효가 된다.
          TURSO_TRADING_URL: ${{ secrets.TURSO_TRADING_URL }}
          TURSO_TRADING_AUTH_TOKEN: ${{ secrets.TURSO_TRADING_AUTH_TOKEN }}
          # 장중 지표를 당일 분봉에서 직접 뽑는다. 없으면 네이버로 폴백되지만
          # 당일 데이터는 양쪽 다 되므로 공식 소스인 키움을 쓴다.
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          # DART 전자공시 (무료 키). 없으면 공시 없이 진행.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          # 멀티모델 앙상블. 전원 합의한 BUY/SELL만 실행하고 갈리면 HOLD.
          # 미설정이면 1 = 켜짐. 모델 목록은 ensemble.DEFAULT_MODELS(opus,sonnet,gemini-*).
          AI_ENSEMBLE: ${{ vars.AI_ENSEMBLE }}
          AI_ENSEMBLE_MODELS: ${{ vars.AI_ENSEMBLE_MODELS }}
          # 없으면 gemini만 조용히 빠지고 claude 모델들로 진행한다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 킬 스위치: 저장소 변수 하나로 자동 주문만 끈다(판단 기록은 계속된다).
          # 미설정이면 0 = 주문 안 나감. 켜려면 저장소 Variables에 AI_AUTOTRADE=1.
          AI_AUTOTRADE: ${{ vars.AI_AUTOTRADE || '0' }}
          AI_ACCOUNT_ID: ${{ vars.AI_ACCOUNT_ID }}
          AI_TOP_N: ${{ vars.AI_TOP_N }}
          AI_MAX_ORDER_KRW: ${{ vars.AI_MAX_ORDER_KRW }}
          AI_MAX_QTY: ${{ vars.AI_MAX_QTY }}
          AI_MAX_POSITION_PCT: ${{ vars.AI_MAX_POSITION_PCT }}
          AI_MAX_ORDERS_PER_DAY: ${{ vars.AI_MAX_ORDERS_PER_DAY }}
          # workflow_dispatch 입력을 run 셸에 직접 보간하면 스크립트 주입이 된다
          # (같은 env에 실린 토큰이 전부 탈취된다). env로 받아 인용·검증한다.
          IN_DATE: ${{ inputs.date }}
          IN_TOP: ${{ inputs.top }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        # bash -e에서 `[ ... ] && x=y`는 조건 거짓 시 스텝을 종료시키므로 if로 쓴다
        run: |
          args=()
          case "$IN_DATE" in
            "") ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args+=(--date "$IN_DATE") ;;
            *) echo "잘못된 date: $IN_DATE" >&2; exit 1 ;;
          esac
          case "$IN_TOP" in
            "") ;;
            *[!0-9]*) echo "잘못된 top: $IN_TOP" >&2; exit 1 ;;
            *) args+=(--top "$IN_TOP") ;;
          esac
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "실행: decide.py ${args[*]}"
          uv run python decide.py "${args[@]}"

      # 방금 낸 주문을 키움 모의계좌로 즉시 미러링한다. 키움은 장중(09:00~15:30)에만
      # 주문을 받으므로 마감 후 collect가 아니라 여기(장중, AI 주문 직후)서 보낸다.
      # 자동주문이 켜졌고 드라이런이 아닐 때만. 낸 주문이 없으면 "대상 없음"으로 넘어간다.
      - name: 키움 모의계좌 미러링
        if: ${{ vars.AI_AUTOTRADE == '1' && !inputs.dry_run }}
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          TURSO_TRADING_URL: ${{ secrets.TURSO_TRADING_URL }}
          TURSO_TRADING_AUTH_TOKEN: ${{ secrets.TURSO_TRADING_AUTH_TOKEN }}
          TURSO_KRX_MARKET_URL: ${{ secrets.TURSO_KRX_MARKET_URL }}
          TURSO_KRX_MARKET_AUTH_TOKEN: ${{ secrets.TURSO_KRX_MARKET_AUTH_TOKEN }}
          AI_ACCOUNT_ID: ${{ vars.AI_ACCOUNT_ID }}
        run: |
          if [ -z "$AI_ACCOUNT_ID" ]; then echo "AI_ACCOUNT_ID 미설정 — 미러링 건너뜀"; exit 0; fi
          uv run python kiwoom_order.py --account-id "$AI_ACCOUNT_ID" --send
