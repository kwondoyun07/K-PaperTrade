# AI 판단 배치 — claude -p로 BUY/SELL/HOLD를 받아 기록하고(옵션) 자동 주문.
# cron은 UTC — 05:10 UTC = 14:10 KST, 장중(09:00~15:30)이다. 마감 후에 돌리면
# 체결 엔진이 ordered_at 이후 당일 분봉만 보므로 주문이 영구 PENDING이 된다.
# 14:10이면 체결에 쓸 분봉이 80분 남는다. 근거는 docs/ai-decisions.md 참고.
name: decide

on:
  schedule:
    - cron: "10 5 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "지표 기준일 YYYY-MM-DD (기본: 오늘 KST). 오늘이 아니면 판단만 기록하고 주문은 생략"
        required: false
      top:
        description: "시총 상위 N종목"
        required: false
      dry_run:
        description: "기록·주문 API를 호출하지 않고 계획만 출력"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 키움 API를 쓰지 않으므로 'kiwoom' 그룹과 분리한다 — collect와 겹쳐도 무해하다.
  group: decide
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: npm install -g @anthropic-ai/claude-code
      - name: AI 판단 실행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TURSO_KRX_MARKET_URL: ${{ secrets.TURSO_KRX_MARKET_URL }}
          TURSO_KRX_MARKET_AUTH_TOKEN: ${{ secrets.TURSO_KRX_MARKET_AUTH_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          # 킬 스위치: 저장소 변수 하나로 자동 주문만 끈다(판단 기록은 계속된다).
          # 미설정이면 0 = 주문 안 나감. 켜려면 저장소 Variables에 AI_AUTOTRADE=1.
          AI_AUTOTRADE: ${{ vars.AI_AUTOTRADE || '0' }}
          AI_ACCOUNT_ID: ${{ vars.AI_ACCOUNT_ID }}
          AI_TOP_N: ${{ vars.AI_TOP_N }}
          AI_MAX_ORDER_KRW: ${{ vars.AI_MAX_ORDER_KRW }}
          AI_MAX_QTY: ${{ vars.AI_MAX_QTY }}
          AI_MAX_POSITION_PCT: ${{ vars.AI_MAX_POSITION_PCT }}
          AI_MAX_ORDERS_PER_DAY: ${{ vars.AI_MAX_ORDERS_PER_DAY }}
        # bash -e에서 `[ ... ] && x=y`는 조건 거짓 시 스텝을 종료시키므로 if로 쓴다
        run: |
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.top }}" ]; then args="$args --top ${{ inputs.top }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          echo "실행: decide.py $args"
          uv run python decide.py $args
