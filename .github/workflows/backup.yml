# 주 1회 Turso 덤프를 저장소에 커밋 — 벤더 리스크 대비 (핸드오프 §10).
# 일요일 05:00 KST = 토요일 20:00 UTC. 시크릿: TURSO_API_TOKEN (플랫폼 API 토큰).
name: backup

on:
  schedule:
    - cron: "0 20 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: turso CLI 설치
        run: curl -sSfL https://get.tur.so/install.sh | bash
      - name: 덤프 생성
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        # pipefail 필수 — 없으면 turso가 실패해도 gzip이 성공해 빈 백업이 조용히 커밋된다
        run: |
          set -eo pipefail
          mkdir -p backups
          for db in krx-market trading; do
            out="backups/${db//-/_}.sql.gz"
            ~/.turso/turso db shell "$db" .dump | gzip > "$out"
            size=$(stat -c%s "$out")
            # 스키마만 있어도 수백 바이트는 나온다 — 그보다 작으면 덤프 실패로 간주
            [ "$size" -ge 200 ] || { echo "::error::$db 덤프가 너무 작음 ($size B)"; exit 1; }
            echo "$out: $size B"
          done
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "backup: 주간 Turso 덤프 $(date -u +%F)"
          git push
